# DESCRIPTION: GitLab CI/CD for libRetro (NOT FOR GitLab-proper)
#
# Builds armsx2_libretro.so on the libretro buildbot (git.libretro.com mirror)
# for Linux x86_64/aarch64, macOS arm64/x86_64, Android arm64-v8a/x86_64 and
# Windows x64.
# Inert on GitHub — the GitHub Actions workflows under .github/workflows/ are
# the project's own CI.
#
# The buildbot containers ship no Clang and none of the pinned third-party
# libraries, so before_script installs clang-17 from apt.llvm.org and reuses
# .github/workflows/scripts/linux/build-dependencies-runner.sh to build the
# same dependency set the GitHub nightly uses (shaderc, SDL3, zstd, lz4, ...).

##############################################################################
################################# BOILERPLATE ################################
##############################################################################

# Core definitions
.core-defs:
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    CORENAME: armsx2
    # CMake puts the finished core in bin/ inside the build tree; the
    # ci-templates pick it up from $BUILD_DIR/$EXTRA_PATH/.
    EXTRA_PATH: bin
    CORE_ARGS: >-
      -DCMAKE_C_COMPILER=clang-17
      -DCMAKE_CXX_COMPILER=clang++-17
      -DCMAKE_EXE_LINKER_FLAGS_INIT=-fuse-ld=lld-17
      -DCMAKE_MODULE_LINKER_FLAGS_INIT=-fuse-ld=lld-17
      -DCMAKE_SHARED_LINKER_FLAGS_INIT=-fuse-ld=lld-17
      -DCMAKE_PREFIX_PATH=$CI_PROJECT_DIR/.deps
      -DENABLE_LIBRETRO=ON
      -DENABLE_QT_UI=OFF
      -DENABLE_SDL_FRONTEND=OFF
      -DENABLE_GSRUNNER=OFF
      -DENABLE_TESTS=OFF
      -DENABLE_RECOMPILER_TEST_HOOKS=OFF
      -DENABLE_SETCAP=OFF
      -DUSE_BACKTRACE=OFF
      -DX11_API=OFF
      -DWAYLAND_API=OFF
      -DDISABLE_ADVANCE_SIMD=TRUE
      -DOVERRIDE_HOST_PAGE_SIZE=4096
      -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON

.core-defs-linux:
  extends: .core-defs
  before_script:
    # The ci-template's script builds with `-j $NUMPROC`; its before_script
    # (which normally sets it) is replaced by this one.
    - export NUMPROC=$(($(nproc) / 2)); [ "$NUMPROC" -lt 1 ] && export NUMPROC=1
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update
    - >-
      apt-get -y install
      build-essential ca-certificates cmake curl git ninja-build nasm pkg-config
      wget gnupg lsb-release software-properties-common
      zlib1g-dev libaio-dev libasound2-dev libcurl4-openssl-dev
      libdbus-1-dev libdrm-dev libegl-dev libevdev-dev libfontconfig1-dev
      libgbm-dev libgudev-1.0-dev libinput-dev libjpeg-dev libopengl-dev
      libpcap-dev libpulse-dev libssl-dev libudev-dev
    - wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
    - chmod +x /tmp/llvm.sh
    - /tmp/llvm.sh 17
    - apt-get -y install lld-17
    - ./.github/workflows/scripts/linux/build-dependencies-runner.sh "$CI_PROJECT_DIR/.deps"

# macOS has no buildbot image to apt-install from: the runner is a shared Mac
# with whatever Xcode it happens to carry and none of the pinned dependencies,
# so the same script the project's own macOS CI uses builds them from source
# first. Qt and ffmpeg are skipped - the core links neither - which is most of
# that script's runtime.
.core-defs-macos:
  extends: .core-defs
  variables:
    # Not bin/ like the Linux jobs: the top-level CMakeLists redirects the
    # library output there only under `UNIX AND NOT APPLE`, so on macOS the
    # dylib stays in the target's own directory.
    EXTRA_PATH: pcsx2-libretro
    # The deps are built against 11.0; the templates default to 10.15/10.9,
    # which is older than the libc++ the C++20 in the emulator needs.
    MACOSX_DEPLOYMENT_TARGET: "11.0"
    CC: clang
    CXX: clang++
    # Replaces the Linux CORE_ARGS from .core-defs wholesale: the clang-17/lld-17
    # flags there name apt packages that exist only in the Linux image.
    CORE_ARGS: >-
      -DCMAKE_PREFIX_PATH=$CI_PROJECT_DIR/.deps
      -DENABLE_LIBRETRO=ON
      -DENABLE_QT_UI=OFF
      -DENABLE_SDL_FRONTEND=OFF
      -DENABLE_GSRUNNER=OFF
      -DENABLE_TESTS=OFF
      -DENABLE_RECOMPILER_TEST_HOOKS=OFF
      -DENABLE_SETCAP=OFF
      -DUSE_BACKTRACE=OFF
      -DX11_API=OFF
      -DWAYLAND_API=OFF
      -DDISABLE_ADVANCE_SIMD=TRUE
      -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON
  # Around 40 minutes of source builds on a cold runner, so keep them.
  cache:
    key:
      files:
        - .github/workflows/scripts/macos/build-dependencies-slice.sh
      prefix: macos-$ARCH
    paths:
      - .deps/
  before_script:
    # Replaces the template's before_script, which is where NUMPROC is normally
    # set for its `-j $NUMPROC` build line. sysctl, not nproc: a stock macOS
    # runner has no coreutils.
    - export NUMPROC=$(($(sysctl -n hw.ncpu)/2)); [ "$NUMPROC" -lt 1 ] && export NUMPROC=1
    - |
      if [ ! -f "$CI_PROJECT_DIR/.deps/lib/libshaderc_combined.a" ] && [ ! -d "$CI_PROJECT_DIR/.deps/include/SDL3" ]; then
        OSX_ARCH=$ARCH BUILD_QT=0 BUILD_FFMPEG=0 \
          ./.github/workflows/scripts/macos/build-dependencies-slice.sh "$CI_PROJECT_DIR/.deps"
      fi

# The Android image carries the NDK and nothing else - no package manager entry
# for any of the pinned libraries, and no distribution behind it to take zlib,
# png or SDL from - so the whole dependency set is cross-built from source first,
# the same way the macOS jobs do it.
#
# API 28: bionic's shared memory (ASharedMemory_create, which the fastmem
# mapping uses in place of the shm_open bionic does not have) arrives at 26, and
# posix_spawn at 28.
.core-defs-android:
  extends: .core-defs
  variables:
    API_LEVEL: 28
    EXTRA_PATH: bin
    CORE_ARGS: >-
      -DCMAKE_PREFIX_PATH=$CI_PROJECT_DIR/.deps
      -DCMAKE_FIND_ROOT_PATH=$CI_PROJECT_DIR/.deps
      -DENABLE_LIBRETRO=ON
      -DENABLE_QT_UI=OFF
      -DENABLE_SDL_FRONTEND=OFF
      -DENABLE_GSRUNNER=OFF
      -DENABLE_TESTS=OFF
      -DENABLE_RECOMPILER_TEST_HOOKS=OFF
      -DENABLE_SETCAP=OFF
      -DUSE_BACKTRACE=OFF
      -DX11_API=OFF
      -DWAYLAND_API=OFF
      -DDISABLE_ADVANCE_SIMD=TRUE
      -DOVERRIDE_HOST_PAGE_SIZE=4096
      -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON
      -DCMAKE_SHARED_LINKER_FLAGS_INIT=-s
  cache:
    key:
      files:
        - .github/workflows/scripts/android/build-dependencies.sh
      prefix: android-$ANDROID_ABI
    paths:
      - .deps/
  before_script:
    # Replaces the template's before_script, which is where NUMPROC is normally
    # set for its `-j $NUMPROC` build line.
    - export NUMPROC=$(($(nproc)/2)); [ "$NUMPROC" -lt 1 ] && export NUMPROC=1
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get -y install cmake ninja-build python3 git ca-certificates
    - |
      if [ ! -f "$CI_PROJECT_DIR/.deps/lib/libshaderc_combined.a" ]; then
        ANDROID_NDK="$NDK_ROOT" ANDROID_ABI="$ANDROID_ABI" ANDROID_API="$API_LEVEL" \
          ./.github/workflows/scripts/android/build-dependencies.sh "$CI_PROJECT_DIR/.deps"
      fi

# Windows is cross-compiled with mingw-w64 rather than MSVC: the buildbot's
# MSVC image is Visual Studio 2019 16.8, which is short of the C++20 this
# emulator uses. The template's own MXE image is not used either - its gcc 11
# predates some of the same library pieces - so this job starts from a stock
# Ubuntu 24.04 (mingw-w64 gcc 13) and builds the pinned dependencies from
# source, the way the Linux and macOS jobs above do.
.core-defs-windows:
  extends: .core-defs
  variables:
    # The DLL stays in the target's own directory: the top-level CMakeLists
    # redirects library output to bin/ only under `UNIX AND NOT APPLE`.
    EXTRA_PATH: pcsx2-libretro
    CMAKE: cmake
    # The template strips with the host's `strip`, which does not know PE;
    # link the DLL stripped instead.
    STRIP_CORE_LIB: 0
    CORE_ARGS: >-
      -DCMAKE_TOOLCHAIN_FILE=$CI_PROJECT_DIR/.github/workflows/scripts/windows/mingw-toolchain.cmake
      -DCMAKE_PREFIX_PATH=$CI_PROJECT_DIR/.deps
      -DCMAKE_FIND_ROOT_PATH=$CI_PROJECT_DIR/.deps;/usr/x86_64-w64-mingw32
      -DENABLE_LIBRETRO=ON
      -DENABLE_QT_UI=OFF
      -DENABLE_SDL_FRONTEND=OFF
      -DENABLE_GSRUNNER=OFF
      -DENABLE_TESTS=OFF
      -DENABLE_RECOMPILER_TEST_HOOKS=OFF
      -DENABLE_SETCAP=OFF
      -DUSE_BACKTRACE=OFF
      -DUSE_D3D=OFF
      -DDISABLE_ADVANCE_SIMD=TRUE
      -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON
  cache:
    key:
      files:
        - .github/workflows/scripts/windows/build-dependencies-mingw.sh
        - .github/workflows/scripts/windows/mingw-toolchain.cmake
      prefix: mingw-deps
    paths:
      - .deps/
  before_script:
    - export NUMPROC=$(($(nproc) / 2)); [ "$NUMPROC" -lt 1 ] && export NUMPROC=1
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update
    - >-
      apt-get -y install
      g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix
      build-essential ca-certificates cmake curl git ninja-build nasm pkg-config python3
    - |
      if [ ! -f "$CI_PROJECT_DIR/.deps/lib/libshaderc_combined.a" ]; then
        ./.github/workflows/scripts/windows/build-dependencies-mingw.sh "$CI_PROJECT_DIR/.deps"
      fi

# Inclusion templates, required for the build to work
include:
  # Linux
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-cmake.yml'

  # macOS. Both slices build on the Apple Silicon runner - see the x86_64 job
  # for why the buildbot's Intel Mac cannot be used.
  - project: 'libretro-infrastructure/ci-templates'
    file: '/osx-cmake-arm64.yml'
  - project: 'libretro-infrastructure/ci-templates'
    file: '/osx-cmake-x86.yml'

  # Android (the NDK cross-build).
  - project: 'libretro-infrastructure/ci-templates'
    file: '/android-cmake.yml'

  # Windows (the mingw-w64 cross-build).
  - project: 'libretro-infrastructure/ci-templates'
    file: '/windows-cmake-mingw.yml'

# Stages for building
stages:
  - build-prepare
  - build-shared

##############################################################################
#################################### STAGES ##################################
##############################################################################
#
################################### DESKTOPS #################################
# Linux 64-bit
libretro-build-linux-x64:
  extends:
    - .libretro-linux-cmake-x86_64
    - .core-defs-linux
  # Stock Ubuntu 22.04 rather than a buildbot image: the amd64 one is Ubuntu
  # 18.04, whose libstdc++ predates the C++20 library the emulator needs and
  # which ships neither libegl-dev nor libopengl-dev. Jammy is also what the
  # project's own GitHub CI builds on, so the dependency script and the
  # clang-17 packages are known to work there.
  image: ubuntu:22.04

# Linux 64-bit (ARM)
libretro-build-linux-aarch64:
  extends:
    - .libretro-linux-cmake-aarch64
    - .core-defs-linux
  image: ubuntu:22.04

# macOS arm64 (Apple Silicon).
libretro-build-osx-arm64:
  extends:
    - .libretro-osx-cmake-arm64
    - .core-defs-macos

# macOS Intel (x86_64), cross-compiled on the Apple Silicon runner.
#
# The tag override is the point of this job: .libretro-osx-cmake-x86_64 inherits
# `macosx-packaging` from the base template, which is the buildbot's Intel Mac -
# macOS 10.15 with Apple clang 12, which has neither the C++20 library nor
# std::bit_cast this code needs. Building the x86_64 slice on the Apple Silicon
# runner instead gets a current clang; ARCH stays x86_64 so the deps script
# builds the matching slice (a mismatch fails at link).
libretro-build-osx-x64:
  extends:
    - .libretro-osx-cmake-x86_64
    - .core-defs-macos
  tags:
    - mac-apple-silicon
  variables:
    CMAKE_OSX_EXTRA: -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_SYSTEM_PROCESSOR=x86_64

# Windows 64-bit, cross-compiled with mingw-w64 on Ubuntu 24.04 - see
# .core-defs-windows for why neither the MSVC nor the MXE image is used.
libretro-build-windows-x64:
  extends:
    - .libretro-windows-cmake-x86_64
    - .core-defs-windows
  image: ubuntu:24.04

################################### CELLULAR #################################
# Android. Both 64-bit ABIs; armeabi-v7a is not built, the emulator is 64-bit
# only here.
libretro-build-android-arm64-v8a:
  extends:
    - .libretro-android-cmake-arm64-v8a
    - .core-defs-android

libretro-build-android-x86_64:
  extends:
    - .libretro-android-cmake-x86_64
    - .core-defs-android
