name: Preflight GL shared context

# Not for upstream. Builds the libretro core the way the buildbot does - and
# the way the report in ARMSX2 #705 was built, with X11 and Wayland off - so
# the GL context sharing in this branch is compiled and linked before anyone is
# asked to run it. Two configurations, because the GL path is reached from both
# directions: with Vulkan, where GL is the fallback, and without, which is what
# a GLES-only host is left with.

on:
  push:
    branches:
      - libretro-gl-shared-context
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - vulkan: "ON"
            name: "GL + Vulkan"
          - vulkan: "OFF"
            name: "GL only (what -DUSE_VULKAN=OFF leaves)"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install packages
        run: |
          # clang-17 from apt.llvm.org, as the project's own libretro workflow
          # does: jammy's clang-14 dies in FPU.cpp with "Unsupported calling
          # convention" before any of this gets interesting.
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo apt-add-repository -n 'deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-17 main'
          sudo apt-get update
          sudo apt-get -y install \
            build-essential clang-17 lld-17 llvm-17 cmake curl git ninja-build nasm patchelf pkg-config zstd zlib1g-dev \
            libaio-dev libasound2-dev libcurl4-openssl-dev libdbus-1-dev libdrm-dev libegl-dev libevdev-dev \
            libfontconfig1-dev libgbm-dev libgudev-1.0-dev libinput-dev libjpeg-dev libopengl-dev libpcap-dev \
            libpulse-dev libssl-dev libudev-dev

      - name: Build dependencies (static)
        run: |
          export DEPS_SHARED=OFF
          ./.github/workflows/scripts/linux/build-dependencies-runner.sh "$GITHUB_WORKSPACE/.deps"

      - name: Take the static jpeg and pcap
        run: |
          ARCHDIR=$(gcc -print-multiarch)
          for lib in libjpeg.a libpcap.a; do
            test -f "/usr/lib/$ARCHDIR/$lib" || { echo "missing /usr/lib/$ARCHDIR/$lib"; exit 1; }
            cp "/usr/lib/$ARCHDIR/$lib" "$GITHUB_WORKSPACE/.deps/lib/"
          done
          echo "--- what .deps/lib holds ---"
          ls "$GITHUB_WORKSPACE/.deps/lib"

      - name: Configure and build the core
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-17 -DCMAKE_CXX_COMPILER=clang++-17 \
            -DCMAKE_EXE_LINKER_FLAGS_INIT=-fuse-ld=lld \
            -DCMAKE_MODULE_LINKER_FLAGS_INIT=-fuse-ld=lld \
            -DCMAKE_SHARED_LINKER_FLAGS_INIT=-fuse-ld=lld \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/.deps" \
            -DENABLE_LIBRETRO=ON -DENABLE_QT_UI=OFF -DENABLE_SDL_FRONTEND=OFF \
            -DENABLE_GSRUNNER=OFF -DENABLE_TESTS=OFF -DENABLE_RECOMPILER_TEST_HOOKS=OFF \
            -DENABLE_SETCAP=OFF -DUSE_BACKTRACE=OFF -DX11_API=OFF -DWAYLAND_API=OFF \
            -DDISABLE_ADVANCE_SIMD=TRUE -DHOST_PAGE_SIZE=4096 \
            -DUSE_VULKAN=${{ matrix.vulkan }} \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
            -DCMAKE_SKIP_BUILD_RPATH=ON -DCMAKE_SKIP_INSTALL_RPATH=ON \
            . -Bbuild/linux-aarch64
          cmake --build build/linux-aarch64 --target armsx2_libretro --config Release -- -j $(nproc)

      - name: What the core ended up needing
        run: |
          CORE=build/linux-aarch64/bin/armsx2_libretro.so
          ls -l "$CORE"
          echo "--- NEEDED ---"
          readelf -d "$CORE" | grep NEEDED

      - uses: actions/upload-artifact@v4
        with:
          name: armsx2_libretro_vulkan_${{ matrix.vulkan }}
          path: build/linux-aarch64/bin/armsx2_libretro.so
