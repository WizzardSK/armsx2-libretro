# Fork-only: what the buildbot's libretro-build-android-arm64-v8a job runs,
# with the NDK the runner carries. Not for upstream.
name: preflight (android libretro)

on:
  workflow_dispatch:
  push:
    branches:
      - preflight-**
      - fix-android-link

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ANDROID_ABI: arm64-v8a
      API_LEVEL: "28"
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: dependencies
        run: |
          set -e
          export NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          ANDROID_NDK="$NDK_ROOT" ANDROID_ABI="$ANDROID_ABI" ANDROID_API="$API_LEVEL" \
            ./.github/workflows/scripts/android/build-dependencies.sh "$GITHUB_WORKSPACE/.deps"

      - name: configure
        run: |
          set -e
          export NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          cmake -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/.deps" \
            -DCMAKE_FIND_ROOT_PATH="$GITHUB_WORKSPACE/.deps" \
            -DENABLE_LIBRETRO=ON -DENABLE_QT_UI=OFF -DENABLE_SDL_FRONTEND=OFF \
            -DENABLE_GSRUNNER=OFF -DENABLE_TESTS=OFF -DENABLE_RECOMPILER_TEST_HOOKS=OFF \
            -DENABLE_SETCAP=OFF -DUSE_BACKTRACE=OFF -DX11_API=OFF -DWAYLAND_API=OFF \
            -DDISABLE_ADVANCE_SIMD=TRUE -DARMSX2_ANDROID_HOST_PAGE_SIZE=0x1000 \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
            -DANDROID_PLATFORM=android-$API_LEVEL \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_STL=c++_static -DANDROID_ABI=$ANDROID_ABI \
            . -Bbuild/android-$ANDROID_ABI

      - name: build
        run: cmake --build build/android-$ANDROID_ABI --target armsx2_libretro --config Release -- -j $(nproc)

      - name: what came out
        run: |
          ls -l build/android-$ANDROID_ABI/bin/ || true
          file build/android-$ANDROID_ABI/bin/*.so || true
