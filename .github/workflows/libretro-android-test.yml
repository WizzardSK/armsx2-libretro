# Fork-only: builds the Android libretro core the way the buildbot job does and
# publishes it as a prerelease, so the fixes in this branch can be tried on a
# device. Not for upstream.
name: libretro android core (test build)

on:
  workflow_dispatch:
  push:
    branches:
      - release-android-test

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      ANDROID_ABI: arm64-v8a
      API_LEVEL: 28
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Tools
        run: sudo apt-get update -qy && sudo apt-get install -qy ninja-build cmake python3

      - name: Dependencies, cross-built for the target
        run: |
          export NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          ANDROID_NDK="$NDK_ROOT" ANDROID_ABI="$ANDROID_ABI" ANDROID_API="$API_LEVEL" \
            ./.github/workflows/scripts/android/build-dependencies.sh "$PWD/.deps"

      - name: Build the core
        run: |
          export NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          cmake -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$PWD/.deps \
            -DCMAKE_FIND_ROOT_PATH=$PWD/.deps \
            -DENABLE_LIBRETRO=ON \
            -DENABLE_QT_UI=OFF \
            -DENABLE_SDL_FRONTEND=OFF \
            -DENABLE_GSRUNNER=OFF \
            -DENABLE_TESTS=OFF \
            -DENABLE_RECOMPILER_TEST_HOOKS=OFF \
            -DENABLE_SETCAP=OFF \
            -DUSE_BACKTRACE=OFF \
            -DX11_API=OFF \
            -DWAYLAND_API=OFF \
            -DDISABLE_ADVANCE_SIMD=TRUE \
            -DARMSX2_ANDROID_HOST_PAGE_SIZE=0x1000 \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
            -DANDROID_PLATFORM=android-$API_LEVEL \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_STL=c++_static \
            -DANDROID_ABI=$ANDROID_ABI \
            . -Bbuild/android-$ANDROID_ABI -G Ninja
          cmake --build build/android-$ANDROID_ABI --target armsx2_libretro -- -j $(nproc)

      - name: Name and strip it as the buildbot does
        run: |
          export NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          mv build/android-$ANDROID_ABI/bin/armsx2_libretro.so armsx2_libretro_android.so
          $NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip armsx2_libretro_android.so
          ls -la armsx2_libretro_android.so
          echo "GIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: armsx2_libretro_android
          path: armsx2_libretro_android.so

      - name: Publish it as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "arm64-v8a libretro core built from \`${GIT_SHA}\` for testing ARMSX2/ARMSX2#663:"
            echo "the Android link fix, the shaders and game database compiled into the core,"
            echo "shaderc linked where the build found the static archive, and emulator warnings"
            echo "routed to the RetroArch log."
            echo
            echo "Drop it into RetroArch's \`cores/\` as \`armsx2_libretro_android.so\`. It should now"
            echo "start with nothing in \`system/pcsx2/resources\` - and if it still does not, the"
            echo "RetroArch log will finally say why."
            echo
            echo "Temporary build off a PR branch; replaced or deleted once that PR lands."
          } > notes.md
          gh release delete android-test --yes --cleanup-tag || true
          gh release create android-test armsx2_libretro_android.so \
            --latest \
            --title "Android test build (${GIT_SHA})" \
            --notes-file notes.md
